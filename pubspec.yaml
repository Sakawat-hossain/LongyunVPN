name: fl_clash
description: LongyunVPN — a fast, secure, multi-platform VPN client powered by Longyun Core (based on Clash.Meta/mihomo).
repository: https://github.com/Sakawat-hossain/LongyunVPN
publish_to: 'none'
version: 1.3.6
environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  window_manager:
    git:
      url: https://github.com/Sakawat-hossain/window_manager
      ref: 5a489acfe5799c38909e3e96abd11b78354f1809
      path: packages/window_manager
  dynamic_color: ^1.8.1
  proxy:
    path: plugins/proxy
  window_ext:
    path: plugins/window_ext
  launch_at_startup: ^0.5.1
  json_annotation: ^4.11.0
  file_picker: ^11.0.2
  mobile_scanner: ^7.0.1
  app_links: ^7.0.0
  win32_registry: ^2.0.0
  tray_manager:
    path: plugins/tray_manager/packages/tray_manager
  wifi_ssid:
    path: plugins/wifi_ssid
  collection: ^1.19.1
  animations: ^2.1.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  # In-app browser for the IP-whitelist and payment pages. Covers Android, iOS,
  # macOS and Windows, so desktop no longer falls back to the system browser.
  flutter_inappwebview: ^6.1.5
  yaml: ^3.1.0
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.0
  ffi: ^2.1.4

  webdav_client: ^1.2.2
  dio: ^5.8.0+1
  win32: ^5.5.1
  re_editor:
    git:
      url: https://github.com/Sakawat-hossain/re-editor
      ref: 78e7671dfd7c411add6acce23a5d9afa3fcdfb5b
  re_highlight: ^0.0.3
  archive: ^4.0.7
  emoji_regex: ^0.0.5
  hotkey_manager: ^0.2.3
  uni_platform: ^0.1.3
  device_info_plus: ^12.2.0
  connectivity_plus: ^7.0.0
  screen_retriever: ^0.2.0
  defer_pointer: ^0.0.2
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  riverpod: ^3.4.2
  material_color_utilities: ^0.13.0
  flutter_js:
    git:
      url: https://github.com/Sakawat-hossain/flutter_js
      ref: c0e10a5dab0e22cd616ec92ae71471d76369cbfe
  flutter_svg: ^2.1.0
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.3
  yaml_writer:
    git:
      url: https://github.com/Sakawat-hossain/yaml_writer
      ref: 79c78a44ec9c2f5f5f97da1a65610c6fb2ead8b3
  super_sliver_list: ^0.4.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  fractional_indexing: ^1.0.0
  reorderable_grid: ^1.0.13
  smooth_sheets: ^1.0.2
  rust_api:
    path: plugins/rust_api
  setup:
    path: plugins/setup
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.13.2
  build_runner: ^2.14.1
  args: ^2.4.2
  freezed: ^4.0.0-dev.3
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8

  drift_dev: ^2.34.5
  intl_utils: ^2.8.16
  test: ^1.31.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/
    - assets/images/avatar/
    - assets/images/empty/
    - assets/images/icon/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
    - family: Icons
      fonts:
        - asset: assets/fonts/Icons.ttf
flutter_intl:
  enabled: true
  class_name: AppLocalizations
  arb_dir: arb
  output_dir: lib/l10n

# Android launcher/adaptive icons are generated from the LongyunVPN shield so the
# whole set stays consistent. Regenerate after changing the source art with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_1024.png"
  min_sdk_android: 21