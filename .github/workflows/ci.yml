name: ci

# Quality gate for every push to main and every pull request. Unlike release.yml
# (which only runs on version tags), this catches analyzer errors, failing tests,
# and Rust helper regressions BEFORE they can reach a release.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `tray_manager` is a pub path dependency that lives in a git submodule
      # (plugins/tray_manager), so `flutter pub get` fails without it. Init just
      # that submodule — the large Go core submodule isn't needed for analyze/test,
      # so leave it out to keep the job fast.
      - name: Fetch tray_manager submodule
        run: git submodule update --init plugins/tray_manager

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Regenerate freezed / riverpod / drift / json output so analysis runs
      # against sources that match the current models, even if the committed
      # generated files are momentarily stale after a model change.
      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test (root package)
        run: flutter test

      # Bundled plugin Dart tests aren't discovered by the root `flutter test`;
      # run the proxy plugin's suite explicitly (see AGENTS.md).
      - name: Test (proxy plugin)
        run: flutter test plugins/proxy/test/proxy_test.dart

  # The Go wrapper had no CI coverage at all: a change that broke `go build` only
  # surfaced during a platform release job, minutes into the matrix. Its own job
  # so the Clash.Meta submodule checkout (large, and needed here for the
  # `replace` directive to resolve) stays off the analyze job's critical path.
  core:
    name: go core check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch core submodule
        run: git submodule update --init --depth 1 core/Clash.Meta

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: core/go.sum

      # CGO off matches the desktop build; the cgo-only files (lib.go, bride.go)
      # are Android's and are covered by the release job's NDK build.
      - name: Build and vet
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go build ./...
          go vet ./...

  helper:
    name: rust helper check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper

      # Compiles the cross-platform service logic (hub.rs / main.rs) without the
      # windows-service feature. build.rs supplies a default (empty) TOKEN, so no
      # secret is needed just to type-check.
      - name: cargo check
        working-directory: services/helper
        run: cargo check --all-targets
