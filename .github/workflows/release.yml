name: release

# Builds every platform/arch on a version tag (e.g. v1.0.4) and publishes a
# single GitHub Release with all artifacts:
#   Windows: LongyunVPN-<ver>-windows-amd64-setup.exe / .zip
#            LongyunVPN-<ver>-windows-arm64-setup.exe / .zip
#   Android: LongyunVPN-<ver>-android-arm64-v8a.apk / -armeabi-v7a.apk / -x86_64.apk
#            LongyunVPN-<ver>-android.aab  (Google Play upload)
#
# Each build job uploads its output as a workflow artifact; a final release job
# gathers them and publishes once (avoids concurrent-release races).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-2022, arch: amd64 }
          - { platform: windows, os: windows-11-arm, arch: arm64 }
          - { platform: android, os: ubuntu-latest, arch: arm64 }
          - { platform: android, os: ubuntu-latest, arch: arm }
          - { platform: android, os: ubuntu-latest, arch: amd64 }
    steps:
      - name: Setup Rust (Windows arm64)
        if: matrix.os == 'windows-11-arm'
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.platform, 'windows')
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter (stable)
        if: matrix.os != 'windows-11-arm'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Setup Flutter (master, Windows arm64)
        if: matrix.os == 'windows-11-arm'
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.44.0-0.1.pre
          cache: true

      - name: Setup NDK
        id: ndk
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      # Optional release signing for the APK. Add these repository secrets to
      # ship a properly-signed APK; without them the build is debug-signed:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Configure Android signing (optional)
        if: matrix.platform == 'android'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } >> android/local.properties
            echo "Release signing configured."
          else
            echo "No keystore secret set — building a debug-signed APK."
          fi

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build (Windows)
        if: startsWith(matrix.platform, 'windows')
        run: dart setup.dart windows --env stable -v

      - name: Build (Android)
        if: matrix.platform == 'android'
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --arch ${{ matrix.arch }} --env stable -v

      # Optional Authenticode signing to satisfy SmartScreen / Smart App Control.
      # Requires a trusted code-signing certificate. Add secrets:
      #   WINDOWS_CERT_BASE64  – base64 of your .pfx
      #   WINDOWS_CERT_PASSWORD
      - name: Sign Windows installer (optional)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:CERT_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\*\signtool.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\(x64|arm64)\\' } | Select-Object -Last 1
            if (-not $signtool) { Write-Host "signtool not found; skipping"; exit 0 }
            Get-ChildItem dist\*.exe | ForEach-Object {
              & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
            }
            Remove-Item $pfx
          } else {
            Write-Host "No WINDOWS_CERT_BASE64 secret — installer left unsigned (SmartScreen / Smart App Control will warn until signed with a trusted certificate)."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: warn

  android-aab:
    name: build android-aab (Play)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Configure Android signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } >> android/local.properties
            echo "Release signing configured."
          else
            echo "No keystore secret set — building a debug-signed bundle."
          fi

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build AAB (all ABIs)
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          echo '{"APP_ENV":"stable","CORE_SHA256":""}' > env.json
          flutter build appbundle --release \
            --dart-define-from-file=env.json \
            --target-platform android-arm,android-arm64,android-x64
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/LongyunVPN-${GITHUB_REF_NAME#v}-android.aab"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-android-aab
          path: dist/
          if-no-files-found: warn

  release:
    name: publish release
    needs: [build, android-aab]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.apk
            dist/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
