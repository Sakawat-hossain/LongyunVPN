name: release

# Builds every platform/arch on a version tag (e.g. v1.1.8) and publishes them
# to a single GitHub Release. Each job uploads its own assets directly (the
# proven approach), so a failure in one platform never blocks the others.
#   Windows: windows-amd64 setup.exe/.zip, windows-arm64 setup.exe/.zip
#   Android: arm64-v8a.apk, armeabi-v7a.apk, x86_64.apk
#   macOS:   macos-arm64.dmg   (universal/amd64 = follow-up)
#   Linux:   linux-amd64 deb/AppImage/rpm  (arm64 = follow-up; no Flutter SDK)
#   + SHA256SUMS over all assets, and GitHub's auto source archives.

on:
  # Manual runs (Actions -> Run workflow) build the full matrix WITHOUT
  # publishing a release — used to test-build a platform (e.g. Android) on
  # demand and read the result, without cutting a tag.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, arch: amd64 }
          - { os: windows-11-arm, arch: arm64 }
    steps:
      - name: Setup Rust (arm64)
        if: matrix.os == 'windows-11-arm'
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter (stable, amd64)
        if: matrix.os != 'windows-11-arm'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      # Flutter's STABLE channel doesn't publish Windows arm64 SDK archives, so
      # subosito can't resolve `stable 3.44.9` on windows-11-arm. Use the master
      # pre-release that ships arm64 — 3.44.0-0.1.pre also has the onReorderItem
      # API the app now uses (verified).
      - name: Setup Flutter (master, arm64)
        if: matrix.os == 'windows-11-arm'
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.44.0-0.1.pre
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build installer
        run: dart setup.dart windows --env stable -v

      # Optional Authenticode signing (SmartScreen / Smart App Control). Add
      # secrets WINDOWS_CERT_BASE64 (base64 of a .pfx) + WINDOWS_CERT_PASSWORD.
      - name: Sign installer (optional)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:CERT_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\*\signtool.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\(x64|arm64)\\' } | Select-Object -Last 1
            if (-not $signtool) { Write-Host "signtool not found; skipping"; exit 0 }
            Get-ChildItem dist\*.exe | ForEach-Object {
              & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
            }
            Remove-Item $pfx
          } else {
            Write-Host "No WINDOWS_CERT_BASE64 secret — installer left unsigned (SmartScreen / Smart App Control will warn until signed)."
          }

      - name: Publish GitHub Release
        # Only publish on a version tag; manual runs are test-builds only.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: android
    # Runs on tag releases and on manual workflow_dispatch. The keystore secret
    # is validated up-front (see "Configure signing"), so a bad secret fails fast
    # with an actionable message instead of shipping a debug-signed build.
    runs-on: ubuntu-latest
    steps:
      # A tagged release must never ship a debug-signed APK: debug keys use the
      # `.dev` application id and can't be updated on a device that has a real
      # build installed. Fail fast (before spending time on the build) if the
      # release keystore secret is missing. See docs/ANDROID_SIGNING.md to set it.
      - name: Require release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — refusing to publish a debug-signed release. See docs/ANDROID_SIGNING.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Export NDK path
        run: echo "ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # Optional release signing. Add secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD to ship a
      # properly-signed APK/AAB; without them the build is debug-signed.
      - name: Configure signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Strip any whitespace the secret may carry (CRLF, line wrapping, a
            # trailing newline from Out-File) before decoding — a common cause of
            # a corrupt keystore on the runner.
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/keystore.jks

            # --- Verify BEFORE signing, one layer at a time, so a failure says
            # exactly which secret is wrong instead of lumping them together.
            # Only lengths of secrets are printed, never their values.
            echo "::group::Decoded keystore inspection"
            ls -l android/app/keystore.jks
            file android/app/keystore.jks || true
            # First bytes tell the format: JKS=feedfeed, PKCS12(DER)=3082/3081/3083.
            # ASCII here (e.g. 6? / 2f) means it decoded to TEXT = mis-encoded.
            head2=$(head -c2 android/app/keystore.jks | od -An -tx1 | tr -d ' \n')
            echo "first bytes : $head2 (expect 'feed' = JKS, or '3082' = PKCS12)"
            # Lengths catch silently mangled secrets — e.g. a password typed in
            # cmd.exe loses '^' characters, so the length comes up short.
            echo "store pwd len: ${#STORE_PASSWORD}"
            echo "key pwd len  : ${#KEY_PASSWORD}"
            echo "alias        : '$KEY_ALIAS' (len ${#KEY_ALIAS})"
            echo "::endgroup::"

            # Layer 1 — is it a keystore at all?
            case "$head2" in
              feed|3081|3082|3083) ;;
              *)
                echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore (first bytes '$head2'; 'file' output above). The secret is mis-encoded — most often double base64-encoded, or the base64 of the wrong file. Re-create it from the ORIGINAL keystore; do NOT regenerate the key (that breaks updates for existing installs)."
                exit 1
                ;;
            esac

            # Layer 2 — does the STORE PASSWORD open it? (no -alias here)
            if ! keytool -list -keystore android/app/keystore.jks \
                 -storepass "$STORE_PASSWORD" > /tmp/ks_list.txt 2>/tmp/ks_err.txt; then
              echo "--- keytool said ---"; cat /tmp/ks_err.txt
              echo "::error::The keystore decoded fine, so ANDROID_KEYSTORE_BASE64 is CORRECT — but ANDROID_STORE_PASSWORD does not open it. Check that secret (see the length above; note cmd.exe eats '^' characters, and a trailing newline counts)."
              exit 1
            fi

            # Layer 3 — does the alias exist? Print the ones that do.
            echo "--- aliases in keystore ---"
            grep -iE "^[^,]+, .*(PrivateKeyEntry|trustedCertEntry)" /tmp/ks_list.txt || cat /tmp/ks_list.txt
            if ! keytool -list -keystore android/app/keystore.jks \
                 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::Keystore opens and the store password is correct, but alias '$KEY_ALIAS' is not in it. Set ANDROID_KEY_ALIAS to one of the aliases listed above."
              exit 1
            fi

            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } >> android/local.properties
            echo "Release signing configured and keystore verified."
          else
            echo "No keystore secret set — building a debug-signed APK/AAB."
          fi

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Per-arch APKs, built sequentially in one job (the proven path). Each run
      # produces LongyunVPN-<abi>.apk in dist/.
      - name: Build APK (arm64-v8a)
        run: dart setup.dart android --arch arm64 --env stable -v

      - name: Build APK (armeabi-v7a)
        run: dart setup.dart android --arch arm --env stable -v

      - name: Build APK (x86_64)
        run: dart setup.dart android --arch amd64 --env stable -v

      - name: Publish GitHub Release
        # Only publish on a version tag; manual runs are test-builds only.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # Apple-Silicon (arm64) only. The Intel runner (macos-13) is being retired by
    # GitHub and queues indefinitely; arm64 covers all current Macs. To also ship
    # Intel later, add a universal build (ARCHS="arm64 x86_64") on macos-14 rather
    # than reintroducing the scarce Intel runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # setup.dart installs appdmg (npm) if missing and drives the Go core build
      # through the podspec hook. Produces LongyunVPN-<ver>-macos-<arch>.dmg.
      - name: Build DMG
        run: dart setup.dart macos --env stable -v

      - name: Publish GitHub Release
        # Only publish on a version tag; manual runs are test-builds only.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: linux-amd64
    # amd64 only: Flutter does not publish a Linux arm64 SDK that
    # subosito/flutter-action can install, so a linux-arm64 job can't set up
    # Flutter. Revisit if/when official Linux arm64 tooling lands.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # setup.dart installs the apt build deps (gtk, appindicator, keybinder,
      # libsecret, rpm/patchelf/libfuse2, appimagetool) via sudo, builds the Go
      # core through the CMake hook, and packages deb + AppImage + rpm (amd64).
      - name: Build packages (deb, AppImage, rpm)
        run: dart setup.dart linux --env stable -v

      - name: Publish GitHub Release
        # Only publish on a version tag; manual runs are test-builds only.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After every platform job, hash all published assets into SHA256SUMS and add
  # it to the release. `always()` so it still runs (over whatever DID upload) if
  # one platform fails; tag-only, since manual dispatch publishes nothing.
  checksums:
    name: checksums
    needs: [windows, android, macos, linux]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets && cd assets
          # Download every asset currently attached to the release.
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern '*' --clobber
          # Don't hash a previous checksums file into the new one.
          rm -f SHA256SUMS
          if [ -z "$(ls -A .)" ]; then
            echo "::warning::No release assets found to checksum."; exit 0
          fi
          sha256sum * > SHA256SUMS
          echo "----- SHA256SUMS -----"; cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber
